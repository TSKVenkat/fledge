name: Bug report
description: Something behaves differently from how it is documented.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: A release tag, or the commit you are running.
    validations: { required: true }
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: The runtime negotiates different capabilities per browser, so this matters more here than in most projects.
      options: [Chrome or Edge, Firefox, Safari, Other]
    validations: { required: true }
  - type: textarea
    id: program
    attributes:
      label: The program, if it involves running code
      render: python
